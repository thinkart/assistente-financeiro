<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistente Financeiro</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('financas-theme')
          var t = stored === 'dark' || stored === 'light' ? stored : 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          /* localStorage indisponível: mantém o tema padrão */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
